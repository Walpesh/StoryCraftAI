<!-- templates/auth.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход / Регистрация</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com "></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-fixed" style="background: linear-gradient(135deg, #e0eafc, #cfdef3); font-family: 'Inter', sans-serif;">

  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">

    <!-- Заголовок и кнопка Назад -->
    <div class="flex justify-between items-center mb-6">
      <a href="/" class="text-2xl font-bold text-indigo-600 hover:text-indigo-800 transition">StoryCraftAI</a>
      <a href="/" class="text-sm text-gray-500 hover:text-indigo-600">← Назад</a>
    </div>

    <h2 class="text-xl font-semibold text-center mb-6">Добро пожаловать!</h2>

    <!-- Tabs -->
    <div class="flex justify-center mb-6">
      <button id="login-tab" class="px-4 py-2 mr-2 font-medium rounded-md {{ 'bg-indigo-600 text-white' if active_tab == 'login' else 'bg-gray-200 text-gray-700' }}">Вход</button>
      <button id="register-tab" class="px-4 py-2 ml-2 font-medium rounded-md {{ 'bg-indigo-600 text-white' if active_tab == 'register' else 'bg-gray-200 text-gray-700' }}">Регистрация</button>
    </div>

    <!-- Сообщение об ошибке -->
    {% if error %}
      <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm">
        {{ error }}
      </div>
    {% endif %}

    <!-- Форма Входа -->
    <form id="login-form" method="POST" action="/login" class="hidden space-y-4" enctype="application/x-www-form-urlencoded">
      <input type="email" name="email" placeholder="Email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input type="password" name="password" placeholder="Пароль" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-md transition duration-200 flex items-center justify-center" id="login-btn">
        Войти
      </button>
    </form>

    <!-- Форма Регистрации -->
    <form id="register-form" method="POST" action="/register" class="hidden space-y-4" enctype="application/x-www-form-urlencoded">
      <input type="text" name="username" placeholder="Имя пользователя" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input type="email" name="email" placeholder="Email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <input type="password" name="password" placeholder="Пароль" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md transition duration-200 flex items-center justify-center" id="register-btn">
        Зарегистрироваться
      </button>
    </form>

    <!-- Ссылка переключения -->
    <div class="mt-4 text-center">
      {% if active_tab == 'login' %}
        Нет аккаунта? <a href="/auth?tab=register" class="text-indigo-600 hover:underline">Зарегистрироваться</a>
      {% else %}
        Уже есть аккаунт? <a href="/auth?tab=login" class="text-indigo-600 hover:underline">Войти</a>
      {% endif %}
    </div>
  </div>

  <!-- JS для табов -->
  <script>
    const tabLogin = document.getElementById('login-tab');
    const tabRegister = document.getElementById('register-tab');
    const formLogin = document.getElementById('login-form');
    const formRegister = document.getElementById('register-form');

    function showLogin() {
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
      tabLogin.classList.replace('bg-gray-200', 'bg-indigo-600');
      tabLogin.classList.replace('text-gray-700', 'text-white');
      tabRegister.classList.replace('bg-indigo-600', 'bg-gray-200');
      tabRegister.classList.replace('text-white', 'text-gray-700');
    }

    function showRegister() {
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
      tabRegister.classList.replace('bg-gray-200', 'bg-indigo-600');
      tabRegister.classList.replace('text-gray-700', 'text-white');
      tabLogin.classList.replace('bg-indigo-600', 'bg-gray-200');
      tabLogin.classList.replace('text-white', 'text-gray-700');
    }

    tabLogin.addEventListener('click', showLogin);
    tabRegister.addEventListener('click', showRegister);

    // Показываем нужный таб при загрузке
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get('tab');
      if (tab === 'register') showRegister();
      else showLogin();
    };
  </script>

</body>
</html>
