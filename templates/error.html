<!-- templates/error.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ошибка | StoryCraftAI</title>
  <script src="https://cdn.tailwindcss.com "></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css " rel="stylesheet">
  <style>
    /* Анимация движущегося градиента */
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .bg-gradient-animate {
      background-size: 200% 200%;
      animation: gradient 3s ease infinite;
    }
  </style>
</head>
<body class="bg-gray-200 text-gray-900 min-h-screen flex flex-col items-center justify-center px-4">

  <!-- Логотип STORYCRAFTAI -->
  <h1 id="gradient-text"
      class="text-5xl md:text-7xl font-black tracking-widest uppercase bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-transparent bg-clip-text bg-gradient-animate inline-block mb-8">
    STORYCRAFTAI
  </h1>

  <!-- Error Card -->
  <div class="max-w-lg w-full bg-white rounded-lg shadow-md p-8 text-center">
    <i class="fas fa-exclamation-triangle text-red-500 text-6xl mb-4"></i>
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">Доступ запрещён / Не найдено</h1>
    <p class="text-gray-600 mb-6">
      {% if error_message %}
        {{ error_message }}
      {% else %}
        Вы не можете просматривать эту страницу. Возможно, вы не авторизованы или книга вам не принадлежит.
      {% endif %}
    </p>

    <a href="/" class="inline-flex items-center px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md shadow transition duration-200">
      <i class="fas fa-home mr-2"></i>
      Вернуться на главную
    </a>
  </div>
</body>
</html>
